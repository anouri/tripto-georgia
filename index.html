<section style="display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; font-family: sans-serif; max-width: 1200px; margin: 0 auto;">
  
  <div style="flex: 1; min-width: 300px; background: #f9f9f9; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2 style="margin-top: 0; color: #333;">Contact Us</h2>
    <p style="color: #666; font-size: 14px;">Have questions? Drop us a line using the form below.</p>
    
    <form action="https://formsubmit.co/r.rezam@yahoo.com" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
      <input type="hidden" name="_subject" value="New Website Message (English)">
      <input type="hidden" name="_replyto" value="%email">
      
      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555;">Your Name</label>
        <input type="text" name="name" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
      </div>
      
      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555;">Your Email address</label>
        <input type="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
      </div>
      
      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555;">Subject</label>
        <input type="text" name="subject" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
      </div>
      
      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555;">Your Message</label>
        <textarea name="message" rows="5" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical;"></textarea>
      </div>
      
      <button type="submit" style="background: #007bff; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.2s;">Send Message</button>
    </form>
  </div>

  <div style="flex: 1; min-width: 300px; background: #f9f9f9; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2 style="margin-top: 0; color: #333;">Neem contact op</h2>
    <p style="color: #666; font-size: 14px;">Heeft u vragen? Stuur ons een bericht via het onderstaande formulier.</p>
    
    <form action="https://formsubmit.co/r.rezam@yahoo.com" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
      <input type="hidden" name="_subject" value="Nieuw websitebericht (Nederlands)">
      <input type="hidden" name="_replyto" value="%email">
      
      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555;">Uw Naam</label>
        <input type="text" name="naam" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
      </div>
      
      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555;">Uw E-mailadres</label>
        <input type="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
      </div>
      
      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555;">Onderwerp</label>
        <input type="text" name="onderwerp" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
      </div>
      
      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555;">Uw Bericht</label>
        <textarea name="bericht" rows="5" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical;"></textarea>
      </div>
      
      <button type="submit" style="background: #28a745; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.2s;">Bericht verzenden</button>
    </form>
  </div>

</section>
